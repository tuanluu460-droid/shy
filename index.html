<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>SMART GARDEN PRO - ĐỖ VĂN ĐẠT</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #22c55e;
  --secondary: #38bdf8;
  --danger: #ef4444;
  --card-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
}
*{margin:0;padding:0;box-sizing:border-box}

body {
  font-family: 'Inter', sans-serif;
  height: 100vh;
  background:
    linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)),
    url('https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?q=80&w=1932&auto=format&fit=crop') center/cover no-repeat fixed;
  color: #e5e7eb;
  overflow: hidden;
}

/* ===== MÀN HÌNH ĐĂNG NHẬP ===== */
#landing{
  position:fixed; inset:0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(2,6,23,0.9)),
    url(https://hoanghamobile.com/tin-tuc/wp-content/uploads/2024/07/anh-cay-xanh-20.jpg) center/cover no-repeat;
  display:flex; align-items:center; justify-content:center;
  z-index:100; transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
}
#landing.hide{ opacity:0; transform: translateY(-100%); pointer-events:none; }

.landing-content{ text-align:center; width: min(520px, 92vw); }
.landing-content h1{
  font-size:64px; font-weight:800; letter-spacing:-2px;
  background: linear-gradient(to right, #22c55e, #38bdf8);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.landing-content p{ margin-top:10px; font-size:18px; color:#94a3b8; }

.login-card{
  margin: 26px auto 0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 22px;
  text-align: left;
  backdrop-filter: blur(14px);
}
.login-card label{
  display:block;
  font-size: 12px;
  font-weight: 700;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: .9px;
  margin-top: 12px;
}
.login-card input{
  width: 100%;
  margin-top: 8px;
  padding: 14px 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(2,6,23,0.55);
  color: #e5e7eb;
  outline: none;
  font-size: 14px;
}
.login-card input:focus{
  border-color: rgba(56,189,248,0.6);
  box-shadow: 0 0 0 4px rgba(56,189,248,0.12);
}

.explore{
  width: 100%;
  margin-top:16px;
  padding:16px 18px;
  border:none; border-radius:16px;
  font-size:16px; font-weight:800;
  background:var(--primary); color:#000;
  cursor:pointer;
  box-shadow: 0 0 26px rgba(34,197,94,0.35);
  transition: 0.25s;
}
.explore:active{ transform: scale(0.99); }

#login-error{
  margin-top: 10px;
  font-size: 13px;
  color: #fca5a5;
  display:none;
}

/* ===== DASHBOARD CHÍNH ===== */
#dashboard{ height:100vh; padding: 30px; overflow-y:auto; }
header{ display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); }
header h2 { font-size: 28px; font-weight: 800; color: #fff; }

/* PHẦN NGÀY GIỜ */
.date-time-box { text-align: right; margin-right: 20px; }
#live-clock { font-size: 20px; font-weight: 800; color: var(--secondary); display: block; }
#live-date { font-size: 13px; color: #94a3b8; font-weight: 600; }

.header-right { display: flex; align-items: center; }

/* nút đăng xuất */
.logout-btn{
  margin-right: 14px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
  color: #e5e7eb;
  font-weight: 700;
  cursor: pointer;
  transition: 0.25s;
  display:flex;
  align-items:center;
  gap: 8px;
}
.logout-btn:hover{
  border-color: rgba(56,189,248,0.55);
  box-shadow: 0 0 0 4px rgba(56,189,248,0.10);
}

.mode-badge { background: rgba(56, 189, 248, 0.15); color: var(--secondary); padding: 8px 20px; border-radius: 50px; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 600; font-size: 14px; }

.main-grid { display: grid; max-width: 1200px; margin: 0 auto; grid-template-columns: 2fr 1fr; gap: 25px; }
.sensor-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:20px; }

.card{
  background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border:1px solid var(--glass-border); border-radius:24px; padding:24px; transition: 0.3s ease;
}

.card i { font-size: 24px; margin-bottom: 15px; display: block; color: var(--secondary); }
.card h3{ color:#94a3b8; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.value{ font-size:36px; font-weight:800; margin-top: 10px; color: #fff; }

.control-panel { display: flex; flex-direction: column; gap: 15px; }
.control-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 5px; }
.label-group { grid-column: 1 / span 2; font-size: 12px; font-weight: 700; color: #475569; margin-top: 10px; text-transform: uppercase; }

button.cmd-btn{
  padding:14px; border:1px solid var(--glass-border); border-radius:16px;
  font-size:14px; font-weight: 600; cursor:pointer; color: #fff;
  background: rgba(255, 255, 255, 0.05); transition: 0.3s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}

button.btn-on.active { background: var(--primary) !important; color: #000 !important; box-shadow: 0 0 20px rgba(34, 197, 94, 0.8); border-color: var(--primary); }
button.btn-off.active { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); border-color: var(--danger); }
button.btn-mode-active { background: var(--secondary) !important; color: #000 !important; box-shadow: 0 0 20px rgba(56, 189, 248, 0.8); border-color: var(--secondary); }

button:disabled{
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none !important;
}

@media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
</style>
</head>

<body>
<!-- LOGIN -->
<div id="landing">
  <div class="landing-content">
    <i class="fa-solid fa-leaf" style="font-size: 80px; color: var(--primary); margin-bottom: 16px;"></i>
    <h1>SMART GARDEN</h1>
    <p>Đăng nhập vào hệ thống để bắt đầu</p>

    <div class="login-card">
      <label for="login-username">Username</label>
      <input id="login-username" placeholder="vd: esp_garden_web" autocomplete="username" />

      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />

      <button class="explore" id="login-btn" onclick="loginAndConnect()">
        Đăng nhập & Kết nối <i class="fa-solid fa-arrow-right" style="font-size: 14px; margin-left: 10px;"></i>
      </button>

      <div id="login-error"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <h2><i class="fa-solid fa-house-chimney-window" style="color: var(--primary); margin-right: 15px;"></i>SMART GARDEN PRO</h2>
    <div class="header-right">
      <button id="logout-btn" class="logout-btn" onclick="logout()" style="display:none;">
        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
      </button>

      <div class="date-time-box">
        <span id="live-clock">00:00:00</span>
        <span id="live-date">Thứ 2, 01/01/2024</span>
        <span id="mqtt-status" style="display:block; margin-top:6px; font-size:12px; color:#94a3b8;">MQTT: Not connected</span>
        <span id="mqtt-user" style="display:block; margin-top:4px; font-size:12px; color:#94a3b8;">User: -</span>
      </div>

      <div class="mode-badge">
        <i class="fa-solid fa-robot" style="margin-right: 8px;"></i> MODE: <span id="mode">ĐANG TẢI...</span>
      </div>
    </div>
  </header>

  <div class="main-grid">
    <div class="sensor-grid">
      <div class="card"><i class="fa-solid fa-temperature-half"></i><h3>Nhiệt độ</h3><div class="value"><span id="temp">--</span>°C</div></div>
      <div class="card"><i class="fa-solid fa-droplet"></i><h3>Độ ẩm không khí</h3><div class="value"><span id="hum">--</span>%</div></div>
      <div class="card"><i class="fa-solid fa-seedling"></i><h3>Độ ẩm đất</h3><div class="value"><span id="soil">--</span>%</div></div>
      <div class="card"><i class="fa-solid fa-sun"></i><h3>Ánh sáng</h3><div class="value"><span id="lux">--</span><small style="font-size: 14px; color:#94a3b8; margin-left:5px;">lux</small></div></div>
      <div class="card"><i class="fa-solid fa-water"></i><h3>Mực nước</h3><div class="value"><span id="dist">--</span><small style="font-size: 14px; color:#94a3b8; margin-left:5px;">cm</small></div></div>
    </div>

    <div class="card control-panel">
      <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-sliders" style="margin-right:10px; color:var(--secondary);"></i>Điều khiển</h3>

      <div class="control-group">
        <div class="label-group">Chế độ vận hành</div>
        <button class="cmd-btn" id="mode_auto" onclick="handleMode('AUTO','MODE_AUTO')">TỰ ĐỘNG</button>
        <button class="cmd-btn" id="mode_manual" onclick="handleMode('MANUAL','MODE_MANUAL')">THỦ CÔNG</button>
      </div>

      <div class="control-group">
        <div class="label-group">Hệ thống tưới</div>
        <button class="cmd-btn btn-on" id="irr_on" onclick="handleBtn('irr','ON','IRR_ON')">BẬT</button>
        <button class="cmd-btn btn-off" id="irr_off" onclick="handleBtn('irr','OFF','IRR_OFF')">TẮT</button>
      </div>

      <div class="control-group">
        <div class="label-group">Ánh sáng</div>
        <button class="cmd-btn btn-on" id="light_on" onclick="handleBtn('light','ON','LIGHT_ON')">BẬT</button>
        <button class="cmd-btn btn-off" id="light_off" onclick="handleBtn('light','OFF','LIGHT_OFF')">TẮT</button>
      </div>

      <div class="control-group">
        <div class="label-group">Máy bơm</div>
        <button class="cmd-btn btn-on" id="pump_on" onclick="handleBtn('pump','ON','PUMP_ON')">BẬT</button>
        <button class="cmd-btn btn-off" id="pump_off" onclick="handleBtn('pump','OFF','PUMP_OFF')">TẮT</button>
      </div>

      <div class="control-group">
        <div class="label-group">Mái che</div>
        <button class="cmd-btn btn-on" id="cover_on" onclick="handleBtn('cover','ON','COVER_OPEN')">MỞ</button>
        <button class="cmd-btn btn-off" id="cover_off" onclick="handleBtn('cover','OFF','COVER_CLOSE')">ĐÓNG</button>
      </div>
    </div>
  </div>
</div>

<script>
// --- HÀM NGÀY GIỜ THỰC ---
function updateClock() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;

  const options = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
  document.getElementById('live-date').innerText = now.toLocaleDateString('vi-VN', options);
}
setInterval(updateClock, 1000);
updateClock();

function openDashboard(){ document.getElementById("landing").classList.add("hide"); }
function showLogin(){ document.getElementById("landing").classList.remove("hide"); }

// ================= MQTT (HiveMQ Cloud via WSS) =================
const MQTT_URL = "wss://8e78060839b64ff580f16575f29219a9.s1.eu.hivemq.cloud:8884/mqtt";
const LS_USER_KEY = "smartgarden_username";

// MQTT runtime vars
let client = null;
let TOPIC_TELE = "";
let TOPIC_CMD  = "";
let currentMode = "AUTO"; // AUTO / MANUAL (from telemetry)

// Status UI
function setMqttStatus(text) {
  document.getElementById("mqtt-status").innerText = "MQTT: " + text;
}
function setLoginError(text){
  const el = document.getElementById("login-error");
  if(!text){
    el.style.display = "none";
    el.innerText = "";
    return;
  }
  el.style.display = "block";
  el.innerText = text;
}

function safeTopicPrefix(u){
  // tránh ký tự lạ làm hỏng topic
  return (u || "").trim().replace(/\s+/g, "_");
}

function resetDashboardUI(){
  document.getElementById("mode").innerText = "ĐANG TẢI...";
  document.getElementById("mqtt-user").innerText = "User: -";
  ["temp","hum","soil","lux","dist"].forEach(id => document.getElementById(id).innerText="--");
  setMqttStatus("Not connected");
}

function afterLoginButtonRestore(){
  const btn = document.getElementById("login-btn");
  btn.disabled = false;
  btn.innerHTML = 'Đăng nhập & Kết nối <i class="fa-solid fa-arrow-right" style="font-size: 14px; margin-left: 10px;"></i>';
}

function loginAndConnect(){
  setLoginError("");
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;

  if(!username || !password){
    setLoginError("Vui lòng nhập đầy đủ username và password.");
    return;
  }

  // LƯU USERNAME (GIỮ KHI LOGOUT)
  localStorage.setItem(LS_USER_KEY, username);

  const prefix = safeTopicPrefix(username);
  TOPIC_TELE = `${prefix}/telemetry`;
  TOPIC_CMD  = `${prefix}/cmd`;

  document.getElementById("mqtt-user").innerText = "User: " + prefix;

  // disable nút login khi đang connect
  const btn = document.getElementById("login-btn");
  btn.disabled = true;
  btn.innerText = "Đang kết nối...";

  // (re)connect
  if(client){
    try { client.end(true); } catch {}
    client = null;
  }

  const options = {
    clientId: "web_" + prefix + "_" + Math.random().toString(16).slice(2),
    username,
    password,
    clean: true,
    reconnectPeriod: 1000,
    connectTimeout: 10_000,
  };

  client = mqtt.connect(MQTT_URL, options);

  // event handlers
  client.on("connect", () => {
    setMqttStatus("Connected");
    client.subscribe(TOPIC_TELE, { qos: 0 }, (err) => {
      if(err){
        setMqttStatus("Subscribe error");
        setLoginError("Kết nối được nhưng subscribe thất bại: " + err.message);
        afterLoginButtonRestore();
        return;
      }

      // OK -> vào dashboard + hiện nút logout
      document.getElementById("logout-btn").style.display = "flex";
      afterLoginButtonRestore();
      openDashboard();
    });
  });

  client.on("reconnect", () => setMqttStatus("Reconnecting..."));
  client.on("close", () => setMqttStatus("Closed"));
  client.on("error", (err) => {
    setMqttStatus("Error: " + err.message);
    setLoginError("Thất bại. Vui lòng kiểm tra username hoặc password.");
    afterLoginButtonRestore();
  });

  client.on("message", (topic, message) => {
    if (topic !== TOPIC_TELE) return;

    let d;
    try { d = JSON.parse(message.toString()); }
    catch { return; }

    // sensor values
    document.getElementById("temp").innerText = (d.temperature ?? "--");
    document.getElementById("hum").innerText  = (d.humidity ?? "--");
    document.getElementById("soil").innerText = (d.soil_pct ?? "--");
    document.getElementById("lux").innerText  = (d.light_lux ?? "--");

    // If you want "water level inverted" like app: 400 - distance_cm
    const dist = Number(d.distance_cm);
    const waterLevel = Number.isFinite(dist) ? Math.max(0, Math.min(400, 400 - dist)) : null;
    document.getElementById("dist").innerText = waterLevel == null ? "--" : waterLevel.toFixed(0);

    // mode & state
    const mode = (d.mode || "AUTO").toString().toUpperCase();
    currentMode = mode;
    document.getElementById("mode").innerText = mode;

    updateModeUI(mode);
    updateDeviceUIFromTelemetry(d);
    lockControlsByMode();
  });

  // restore nút login nếu connect quá lâu
  setTimeout(() => {
    if(!client || !client.connected){
      afterLoginButtonRestore();
    }
  }, 12000);
}

function logout(){
  setLoginError("");
  try{
    if(client){
      client.end(true); // force close
    }
  } catch {}

  client = null;
  TOPIC_TELE = "";
  TOPIC_CMD  = "";
  currentMode = "AUTO";

  // ẨN logout, reset UI dashboard
  document.getElementById("logout-btn").style.display = "none";
  resetDashboardUI();

  // GIỮ USERNAME, CHỈ XÓA PASSWORD ĐANG NHẬP
  document.getElementById("login-password").value = "";

  showLogin();
  document.getElementById("login-password").focus();
}

function cmd(c){
  if(!client || !client.connected) return;
  client.publish(TOPIC_CMD, c, { qos: 0 });
}

// ===== UI helpers =====
function updateModeUI(mode) {
  if(mode === "AUTO") {
    document.getElementById("mode_auto").classList.add("btn-mode-active");
    document.getElementById("mode_manual").classList.remove("btn-mode-active");
  } else {
    document.getElementById("mode_manual").classList.add("btn-mode-active");
    document.getElementById("mode_auto").classList.remove("btn-mode-active");
  }
}

function setActivePair(group, isOn){
  const onBtn  = document.getElementById(group + "_on");
  const offBtn = document.getElementById(group + "_off");
  onBtn.classList.toggle("active", !!isOn);
  offBtn.classList.toggle("active", !isOn);
}

function updateDeviceUIFromTelemetry(d){
  const irr = (d.irrigation || "OFF").toString().toUpperCase() === "ON";
  const lig = (d.light || "OFF").toString().toUpperCase() === "ON";
  const pum = (d.pump || "OFF").toString().toUpperCase() === "ON";
  const covClosed = (d.cover || "OPEN").toString().toUpperCase() === "CLOSE";

  setActivePair("irr", irr);
  setActivePair("light", lig);
  setActivePair("pump", pum);

  // cover buttons map: cover_on = OPEN, cover_off = CLOSE
  document.getElementById("cover_on").classList.toggle("active", !covClosed);
  document.getElementById("cover_off").classList.toggle("active", covClosed);
}

function lockControlsByMode(){
  const manual = (currentMode === "MANUAL");

  // device buttons disabled when AUTO
  const ids = ["irr_on","irr_off","light_on","light_off","pump_on","pump_off","cover_on","cover_off"];
  ids.forEach(id => {
    const b = document.getElementById(id);
    b.disabled = !manual;
  });
}

// ===== button handlers =====
function handleMode(mode, command) {
  cmd(command);
}

function handleBtn(group, status, command) {
  if (currentMode !== "MANUAL") return;
  cmd(command);
}

// Cho phép nhấn Enter để đăng nhập
document.getElementById("login-password").addEventListener("keydown", (e) => {
  if(e.key === "Enter") loginAndConnect();
});
document.getElementById("login-username").addEventListener("keydown", (e) => {
  if(e.key === "Enter") loginAndConnect();
});

// Auto-fill username từ localStorage
(function initLoginPrefill(){
  const savedUser = localStorage.getItem(LS_USER_KEY);
  if(savedUser){
    document.getElementById("login-username").value = savedUser;
    document.getElementById("login-password").focus();
  } else {
    document.getElementById("login-username").focus();
  }
})();
</script>
</body>
</html>
